# Tests fuer jeden Branch, einschliesslich direkter Pushes auf main.
name: Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          cargo test --locked

  # macOS: bauen und testen, damit das Release fuer Mac nicht erst beim Veroeffentlichen scheitert
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          cargo test --locked -- --skip debugging_a_program_stops_at_breakpoints
      - name: MCP-Server antwortet
        run: |
          cargo build --locked
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/debug/easymysql mcp | tee out.txt
          grep -q '"name":"get_schema"' out.txt

  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Windows bauen
        run: cargo build --locked
      - name: Java-Autofix im nativen Fenster pruefen
        shell: pwsh
        run: .github/scripts/windows-ui.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: ${{ runner.temp }}/easymysql-ui
