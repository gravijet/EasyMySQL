# Build Windows (installer, portable), macOS (universal app) and Linux packages and publish one GitHub release.
name: EasyMySQL Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The newest stable long-term-support series of MariaDB is chosen automatically
  # (MariaDB download API); this series is only used if the list of series cannot be read.
  MARIADB_SERIES: "12.3"
  # Fall back to an archived release if the MariaDB download API is unavailable.
  MARIADB_FALLBACK_URL: https://archive.mariadb.org/mariadb-12.3.3/winx64-packages/mariadb-12.3.3-winx64.zip
  MARIADB_FALLBACK_SHA256: 4b5706b47148b47c8f36963c8352d1ddee37a1287b4690428f631a74b09b85a0
  MARIADB_FALLBACK_VERSION: "12.3.3"
  ODBC_URL: https://dlm.mariadb.com/4785809/Connectors/odbc/connector-odbc-3.2.9/codbc-amd64-windows/mariadb-connector-odbc-3.2.9-win64.msi
  ODBC_SHA256: 3aaa0202a48e456a692f1864b62da3baeb037eb797692e1737eb675c05fda038
  VCREDIST_URL: https://aka.ms/vs/17/release/vc_redist.x64.exe

jobs:
  # A release is only built when Cargo.toml carries a version that has no tag yet,
  # so every published version is a deliberate decision (see "Versioning" in the README).
  check:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.tag.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)".*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Version $v is already released; nothing to do."
          fi

  windows:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: ver
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "EasyMySQL $v"

      # Der Debugger-Test braucht ein echtes JDK und jdb; er laeuft in ci.yml (Tests), nicht als Huerde fuers Release.
      - name: Run unit tests
        run: cargo test --locked -- --skip debugging_a_program_stops_at_breakpoints

      - name: Build EasyMySQL.exe
        run: cargo build --release --locked

      - name: Download MariaDB, ODBC driver and VC++ runtime
        id: mdb
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force build/redist | Out-Null

          function Get-Checked($url, $out, $sha) {
            for ($i = 1; $i -le 4; $i++) {
              try { Invoke-WebRequest $url -OutFile $out -UseBasicParsing; break }
              catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (2 * $i) }
            }
            if ($sha) {
              $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
              if ($h -ne $sha) { throw "Checksum mismatch for ${out}: $h" }
            }
          }

          # Newest stable LTS series (pre-releases, RCs and short-term "rolling" releases are skipped)
          $series = $env:MARIADB_SERIES
          try {
            $majors = (Invoke-RestMethod "https://downloads.mariadb.org/rest-api/mariadb/").major_releases |
              Where-Object { $_.release_status -eq 'Stable' -and $_.release_support_type -eq 'Long Term Support' } |
              Sort-Object { [version]$_.release_id } -Descending
            if ($majors) { $series = $majors[0].release_id }
          } catch {
            Write-Warning "MariaDB series list unavailable ($_) — using $series"
          }
          Write-Host "MariaDB series: $series"

          # Latest release of that series from the official MariaDB API.
          $ok = $false
          try {
            $api = Invoke-RestMethod "https://downloads.mariadb.org/rest-api/mariadb/$series/latest/"
            $rel = $api.releases.PSObject.Properties | Select-Object -First 1
            $file = $rel.Value.files | Where-Object { $_.file_name -like '*-winx64.zip' -and $_.file_name -notlike '*debug*' } | Select-Object -First 1
            if (-not $file) { throw "No winx64.zip found" }
            Write-Host "Latest MariaDB: $($rel.Name) ($($file.file_download_url))"
            Get-Checked $file.file_download_url build/mariadb.zip $file.checksum.sha256sum.ToLower()
            $mdbVersion = $rel.Name
            $ok = $true
          } catch {
            Write-Warning "Latest MariaDB unavailable ($_) — using pinned version $env:MARIADB_FALLBACK_VERSION"
          }
          # Fall back to the pinned release from the MariaDB archive.
          if (-not $ok) {
            Get-Checked $env:MARIADB_FALLBACK_URL build/mariadb.zip $env:MARIADB_FALLBACK_SHA256
            $mdbVersion = $env:MARIADB_FALLBACK_VERSION
          }
          "version=$mdbVersion" >> $env:GITHUB_OUTPUT
          Expand-Archive build/mariadb.zip -DestinationPath build/tmp
          Move-Item (Get-ChildItem build/tmp -Directory | Select-Object -First 1).FullName build/mariadb
          # Remove unnecessary developer files to reduce package size.
          Get-ChildItem build/mariadb -Recurse -Include *.pdb,*.lib | Remove-Item -Force
          Remove-Item build/mariadb/include -Recurse -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path build/mariadb/bin/mysql.exe)) {
            Copy-Item build/mariadb/bin/mariadb.exe build/mariadb/bin/mysql.exe
          }
          Get-ChildItem build/mariadb/bin/mysql*.exe | Select-Object Name

          # Drivers are optional: build the installer even if a download fails.
          try { Get-Checked $env:ODBC_URL build/redist/mariadb-connector-odbc.msi $env:ODBC_SHA256 }
          catch { Write-Warning "ODBC driver unavailable: $_"; Remove-Item build/redist/mariadb-connector-odbc.msi -ErrorAction SilentlyContinue }
          try { Get-Checked $env:VCREDIST_URL build/redist/vc_redist.x64.exe $null }
          catch { Write-Warning "VC++ runtime unavailable: $_"; Remove-Item build/redist/vc_redist.x64.exe -ErrorAction SilentlyContinue }

      - name: Smoke test (initialize and start server)
        run: |
          $ErrorActionPreference = 'Stop'
          $data = "$env:RUNNER_TEMP\mdbtest"
          & build/mariadb/bin/mariadb-install-db.exe "--datadir=$data" --port=3399
          # Use the application safety settings (src/server.rs, SAFETY_OPTIONS).
          $safety = "--default-storage-engine=InnoDB","--innodb-flush-log-at-trx-commit=1","--innodb-doublewrite=ON","--innodb-file-per-table=ON","--aria-recover-options=BACKUP,QUICK","--myisam-recover-options=BACKUP,FORCE"
          $p = Start-Process build/mariadb/bin/mariadbd.exe -ArgumentList (@("--datadir=$data","--port=3399","--console") + $safety) -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          & build/mariadb/bin/mysql.exe -u root -P 3399 -h 127.0.0.1 -e "SELECT VERSION(), @@innodb_flush_log_at_trx_commit, @@innodb_doublewrite; CREATE DATABASE t; CREATE TABLE t.x (id INT PRIMARY KEY); INSERT INTO t.x VALUES (1),(2); SHOW DATABASES;"
          if ($LASTEXITCODE -ne 0) { throw "mysql -u root failed" }
          # Exercise the application backup command.
          & build/mariadb/bin/mariadb-dump.exe -u root -P 3399 -h 127.0.0.1 --single-transaction --routines --triggers --events t | Out-File -Encoding utf8 "$env:RUNNER_TEMP\t.sql"
          if ($LASTEXITCODE -ne 0) { throw "mariadb-dump failed" }
          & build/mariadb/bin/mariadb-admin.exe -u root -P 3399 -h 127.0.0.1 shutdown
          $p.WaitForExit(20000) | Out-Null

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DMariaDBVersion=${{ steps.mdb.outputs.version }}" installer\EasyMySQL.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Build portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $p = "build/portable/EasyMySQL"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target/release/easymysql.exe "$p/EasyMySQL.exe"
          Copy-Item build/mariadb "$p/mariadb" -Recurse
          Compress-Archive -Path $p -DestinationPath "dist/EasyMySQL-portable-${{ steps.ver.outputs.version }}.zip" -CompressionLevel Optimal
          # Small update package: only the program. The app downloads and installs it in the background.
          New-Item -ItemType Directory -Force build/app | Out-Null
          Copy-Item target/release/easymysql.exe build/app/EasyMySQL.exe
          Compress-Archive -Path build/app/EasyMySQL.exe -DestinationPath "dist/EasyMySQL-app-${{ steps.ver.outputs.version }}.zip" -CompressionLevel Optimal
          Get-ChildItem dist | Select-Object Name, Length
          # Die MariaDB-Version braucht der Veroeffentlichungsschritt fuer den Text des Releases
          Set-Content -Encoding ascii dist/mariadb-version.txt "${{ steps.mdb.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  # macOS (one universal app for Apple Silicon and Intel) and Linux (x86_64).
  # MariaDB is not bundled there: install.sh installs it with Homebrew or the package manager.
  unix:
    needs: check
    if: needs.check.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: macos
          - os: ubuntu-22.04
            kind: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.kind }}

      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: cargo test --locked -- --skip debugging_a_program_stops_at_breakpoints

      - name: Build macOS app (universal)
        if: matrix.kind == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          app="build/EasyMySQL.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources" dist
          lipo -create -output "$app/MacOS/easymysql" target/aarch64-apple-darwin/release/easymysql target/x86_64-apple-darwin/release/easymysql
          lipo -info "$app/MacOS/easymysql"
          # Icon: 256 px PNG from the program itself, scaled into an .icns
          "$app/MacOS/easymysql" __write-icon build/icon.png
          mkdir -p build/EasyMySQL.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s build/icon.png --out "build/EasyMySQL.iconset/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 64 128; do cp "build/EasyMySQL.iconset/icon_$((s*2))x$((s*2)).png" "build/EasyMySQL.iconset/icon_${s}x${s}@2x.png"; done
          iconutil -c icns build/EasyMySQL.iconset -o "$app/Resources/EasyMySQL.icns"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>EasyMySQL</string>
            <key>CFBundleDisplayName</key><string>EasyMySQL</string>
            <key>CFBundleIdentifier</key><string>at.benjaminberger.easymysql</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleExecutable</key><string>easymysql</string>
            <key>CFBundleIconFile</key><string>EasyMySQL</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>SQL</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>CFBundleTypeExtensions</key><array><string>sql</string></array>
            </dict></array>
          </dict></plist>
          PLIST
          plutil -lint "$app/Info.plist"
          # Ad-hoc signature: Apple Silicon only runs signed code
          codesign --force --deep --sign - build/EasyMySQL.app
          "$app/MacOS/easymysql" --version
          tar -C build -czf "dist/EasyMySQL-macos-universal-$v.tar.gz" EasyMySQL.app

      - name: Build Linux package
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          cargo build --release --locked
          p="build/EasyMySQL"
          mkdir -p "$p" dist
          cp target/release/easymysql "$p/easymysql"
          "$p/easymysql" __write-icon "$p/easymysql.png"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=EasyMySQL' 'Comment=MariaDB server and database manager' \
            'Exec=easymysql %F' 'Icon=easymysql' 'Terminal=false' 'Categories=Development;Database;' 'MimeType=application/sql;' > "$p/easymysql.desktop"
          "$p/easymysql" --version
          tar -C build -czf "dist/EasyMySQL-linux-x64-$v.tar.gz" EasyMySQL

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.kind }}
          path: dist/*

  # One release with every package. macOS/Linux are optional: a failure there never blocks Windows.
  publish:
    needs: [check, windows, unix]
    if: always() && needs.check.outputs.new == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        id: sums
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          mdb=$(cat dist/mariadb-version.txt 2>/dev/null || echo "")
          echo "mariadb=$mdb" >> "$GITHUB_OUTPUT"
          rm -f dist/mariadb-version.txt
          # Pruefsummen als eigene Datei: die Website liest sie auch, wenn die GitHub-API gerade nicht antwortet
          (cd dist && sha256sum -- * | sed 's/ \*/  /' > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls dist/EasyMySQL-macos-universal-*.tar.gz >/dev/null 2>&1 && echo "mac=true" >> "$GITHUB_OUTPUT" || echo "mac=false" >> "$GITHUB_OUTPUT"
          ls dist/EasyMySQL-linux-x64-*.tar.gz >/dev/null 2>&1 && echo "linux=true" >> "$GITHUB_OUTPUT" || echo "linux=false" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.sums.outputs.version }}
          name: EasyMySQL ${{ steps.sums.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            ## EasyMySQL ${{ steps.sums.outputs.version }}

            MariaDB server and graphical database manager in one application — for Windows, macOS and Linux.

            ### Install with one command

            ```powershell
            # Windows (PowerShell)
            irm https://mysql.benjaminberger.at/install.ps1 | iex
            ```

            ```sh
            # macOS and Linux
            curl -fsSL https://mysql.benjaminberger.at/install.sh | sh
            ```

            The script verifies the SHA-256 checksum, installs EasyMySQL (and MariaDB on macOS/Linux) and offers to connect Claude Code and Codex.

            ### Downloads

            - **`EasyMySQL-Setup-${{ steps.sums.outputs.version }}.exe`** — Windows 10/11 (64-bit), recommended. Installs MariaDB, optional drivers and environment variables. Works offline; MariaDB is included.
            - `EasyMySQL-portable-${{ steps.sums.outputs.version }}.zip` — Windows; extract and run `EasyMySQL.exe`. Does not modify `PATH`.
            - `EasyMySQL-macos-universal-${{ steps.sums.outputs.version }}.tar.gz` — macOS 11+ (Apple Silicon and Intel). Needs MariaDB from Homebrew (`brew install mariadb`).${{ steps.sums.outputs.mac != 'true' && ' *Not built for this release.*' || '' }}
            - `EasyMySQL-linux-x64-${{ steps.sums.outputs.version }}.tar.gz` — Linux x86_64 (glibc 2.35+). Needs the MariaDB server binaries from your package manager.${{ steps.sums.outputs.linux != 'true' && ' *Not built for this release.*' || '' }}

            If Windows SmartScreen reports an unknown publisher, choose *More info → Run anyway*. On macOS the app is ad-hoc signed; when it was downloaded in a browser, right-click → *Open* the first time.

            ### AI assistants (new)

            - `easymysql mcp` is an MCP server: Claude Code, Codex, Cursor and others read schemas, run read-only queries and — when allowed under *Settings → AI assistants* — change data, with a backup before destructive statements.
            - `easymysql setup-ai` registers the server and a skill in Claude Code and Codex. Plugins: `/plugin marketplace add gravijet/EasyMySQL` (Claude Code), `codex plugin marketplace add gravijet/EasyMySQL` (Codex).

            ### Features

            - SQL editor with suggestions, checks and fixes; table editing; ER diagrams; query builder; users and privileges; integrated terminal; automatic backups.
            - Import from SQLite, MongoDB, CSV, Redis, MariaDB/MySQL and PostgreSQL; export to SQL, JSON, CSV, XML, SQLite, PostgreSQL, MongoDB, Redis files or straight to another server.
            - Java, Python and JavaScript/TypeScript projects with a ready database connection, tests, a Java debugger and language servers.
            - Git and GitHub in the sidebar; TLS with an own certificate; MariaDB updates with backup and automatic rollback.

            ### Included (Windows)

            - EasyMySQL ${{ steps.sums.outputs.version }} (Rust)
            - MariaDB ${{ steps.sums.outputs.mariadb }} (server and command-line tools such as `mysql` and `mysqldump`)
            - MariaDB ODBC driver 3.2.9 and the “EasyMySQL” ODBC data source (optional)
            - Microsoft Visual C++ runtime
            - Environment variables: `PATH` (`easymysql`, `mysql`), `EASYMYSQL_HOME`, `MARIADB_HOME`

            The database server runs while EasyMySQL is open, including when minimized to the system tray. It does not start automatically with the system.
