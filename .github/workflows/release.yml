# Build the Windows installer and publish a GitHub release.
name: EasyMySQL Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  # MariaDB LTS series; automatically download its latest release.
  MARIADB_SERIES: "11.8"
  # Fall back to an archived release if the MariaDB download API is unavailable.
  MARIADB_FALLBACK_URL: https://archive.mariadb.org/mariadb-11.8.9/winx64-packages/mariadb-11.8.9-winx64.zip
  MARIADB_FALLBACK_SHA256: 830c46727d9278eae212ae3eca44eeb9e71b2a68704e95f344a64fba7b1963f5
  MARIADB_FALLBACK_VERSION: "11.8.9"
  ODBC_URL: https://dlm.mariadb.com/4785809/Connectors/odbc/connector-odbc-3.2.9/codbc-amd64-windows/mariadb-connector-odbc-3.2.9-win64.msi
  ODBC_SHA256: 3aaa0202a48e456a692f1864b62da3baeb037eb797692e1737eb675c05fda038
  VCREDIST_URL: https://aka.ms/vs/17/release/vc_redist.x64.exe

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: ver
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "EasyMySQL $v"

      - name: Run unit tests
        run: cargo test --locked

      - name: Build EasyMySQL.exe
        run: cargo build --release --locked

      - name: Download MariaDB, ODBC driver and VC++ runtime
        id: mdb
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force build/redist | Out-Null

          function Get-Checked($url, $out, $sha) {
            for ($i = 1; $i -le 4; $i++) {
              try { Invoke-WebRequest $url -OutFile $out -UseBasicParsing; break }
              catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (2 * $i) }
            }
            if ($sha) {
              $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
              if ($h -ne $sha) { throw "Checksum mismatch for ${out}: $h" }
            }
          }

          # Try the latest LTS release from the official MariaDB API.
          $ok = $false
          try {
            $api = Invoke-RestMethod "https://downloads.mariadb.org/rest-api/mariadb/$($env:MARIADB_SERIES)/latest/"
            $rel = $api.releases.PSObject.Properties | Select-Object -First 1
            $file = $rel.Value.files | Where-Object { $_.file_name -like '*-winx64.zip' -and $_.file_name -notlike '*debug*' } | Select-Object -First 1
            if (-not $file) { throw "No winx64.zip found" }
            Write-Host "Latest MariaDB: $($rel.Name) ($($file.file_download_url))"
            Get-Checked $file.file_download_url build/mariadb.zip $file.checksum.sha256sum.ToLower()
            $mdbVersion = $rel.Name
            $ok = $true
          } catch {
            Write-Warning "Latest MariaDB unavailable ($_) — using pinned version $env:MARIADB_FALLBACK_VERSION"
          }
          # Fall back to the pinned release from the MariaDB archive.
          if (-not $ok) {
            Get-Checked $env:MARIADB_FALLBACK_URL build/mariadb.zip $env:MARIADB_FALLBACK_SHA256
            $mdbVersion = $env:MARIADB_FALLBACK_VERSION
          }
          "version=$mdbVersion" >> $env:GITHUB_OUTPUT
          Expand-Archive build/mariadb.zip -DestinationPath build/tmp
          Move-Item (Get-ChildItem build/tmp -Directory | Select-Object -First 1).FullName build/mariadb
          # Remove unnecessary developer files to reduce package size.
          Get-ChildItem build/mariadb -Recurse -Include *.pdb,*.lib | Remove-Item -Force
          Remove-Item build/mariadb/include -Recurse -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path build/mariadb/bin/mysql.exe)) {
            Copy-Item build/mariadb/bin/mariadb.exe build/mariadb/bin/mysql.exe
          }
          Get-ChildItem build/mariadb/bin/mysql*.exe | Select-Object Name

          # Drivers are optional: build the installer even if a download fails.
          try { Get-Checked $env:ODBC_URL build/redist/mariadb-connector-odbc.msi $env:ODBC_SHA256 }
          catch { Write-Warning "ODBC driver unavailable: $_"; Remove-Item build/redist/mariadb-connector-odbc.msi -ErrorAction SilentlyContinue }
          try { Get-Checked $env:VCREDIST_URL build/redist/vc_redist.x64.exe $null }
          catch { Write-Warning "VC++ runtime unavailable: $_"; Remove-Item build/redist/vc_redist.x64.exe -ErrorAction SilentlyContinue }

      - name: Smoke test (initialize and start server)
        run: |
          $ErrorActionPreference = 'Stop'
          $data = "$env:RUNNER_TEMP\mdbtest"
          & build/mariadb/bin/mariadb-install-db.exe "--datadir=$data" --port=3399
          # Use the application safety settings (src/server.rs, SAFETY_OPTIONS).
          $safety = "--default-storage-engine=InnoDB","--innodb-flush-log-at-trx-commit=1","--innodb-doublewrite=ON","--innodb-file-per-table=ON","--aria-recover-options=BACKUP,QUICK","--myisam-recover-options=BACKUP,FORCE"
          $p = Start-Process build/mariadb/bin/mariadbd.exe -ArgumentList (@("--datadir=$data","--port=3399","--console") + $safety) -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          & build/mariadb/bin/mysql.exe -u root -P 3399 -h 127.0.0.1 -e "SELECT VERSION(), @@innodb_flush_log_at_trx_commit, @@innodb_doublewrite; CREATE DATABASE t; CREATE TABLE t.x (id INT PRIMARY KEY); INSERT INTO t.x VALUES (1),(2); SHOW DATABASES;"
          if ($LASTEXITCODE -ne 0) { throw "mysql -u root failed" }
          # Exercise the application backup command.
          & build/mariadb/bin/mariadb-dump.exe -u root -P 3399 -h 127.0.0.1 --single-transaction --routines --triggers --events t | Out-File -Encoding utf8 "$env:RUNNER_TEMP\t.sql"
          if ($LASTEXITCODE -ne 0) { throw "mariadb-dump failed" }
          & build/mariadb/bin/mariadb-admin.exe -u root -P 3399 -h 127.0.0.1 shutdown
          $p.WaitForExit(20000) | Out-Null

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DMariaDBVersion=${{ steps.mdb.outputs.version }}" installer\EasyMySQL.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Build portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $p = "build/portable/EasyMySQL"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target/release/easymysql.exe "$p/EasyMySQL.exe"
          Copy-Item build/mariadb "$p/mariadb" -Recurse
          Compress-Archive -Path $p -DestinationPath "dist/EasyMySQL-portable-${{ steps.ver.outputs.version }}.zip" -CompressionLevel Optimal
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EasyMySQL-Setup
          path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: EasyMySQL ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/EasyMySQL-Setup-${{ steps.ver.outputs.version }}.exe
            dist/EasyMySQL-portable-${{ steps.ver.outputs.version }}.zip
          body: |
            ## EasyMySQL ${{ steps.ver.outputs.version }}

            MariaDB server and graphical database manager for Windows (64-bit) in one application.

            ### Download

            - **`EasyMySQL-Setup-${{ steps.ver.outputs.version }}.exe`** — recommended. Installs MariaDB, optional drivers and environment variables. Works offline; MariaDB is included.
            - `EasyMySQL-portable-${{ steps.ver.outputs.version }}.zip` — extract and run `EasyMySQL.exe`. Does not modify `PATH`.

            ### Installation

            1. Download and run `EasyMySQL-Setup-${{ steps.ver.outputs.version }}.exe`.
               If Windows SmartScreen reports an unknown publisher, choose *More info → Run anyway*.
            2. Launch EasyMySQL. The database server is initialized automatically on first launch.
            3. Open Command Prompt (cmd) and enter `mysql -u root`.

            ### Features

            - English interface by default; German is selectable under Settings → Appearance.
            - Dark mode by default; a light theme is also available.
            - SQL editor, query builder, ER diagrams, automatic backups and update checks.
            - Cached editor layout and diagram routes, shared result data, and background project scans and file searches.

            ### Included

            - EasyMySQL ${{ steps.ver.outputs.version }} (Rust)
            - MariaDB ${{ steps.mdb.outputs.version }} (server and command-line tools such as `mysql` and `mysqldump`)
            - MariaDB ODBC driver 3.2.9 and the “EasyMySQL” ODBC data source (optional)
            - Microsoft Visual C++ runtime
            - Environment variables: `PATH`, `EASYMYSQL_HOME`, `MARIADB_HOME`

            The database server runs while EasyMySQL is open, including when minimized to the system tray. It does not start automatically with Windows.
