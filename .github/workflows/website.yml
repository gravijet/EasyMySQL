# Rollt die Website (Cloudflare Worker) automatisch aus: bei jedem Push auf main
# und nach jedem fertigen Release. Version und Downloads holt der Worker selbst live von GitHub
# (website/src/worker.js); das erneute Ausrollen haelt also auch Texte und Seiteninhalt aktuell.
# Einmalig noetig: die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID im Repository anlegen.
name: Website ausrollen

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["EasyMySQL Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten pruefen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN oder CLOUDFLARE_ACCOUNT_ID fehlt (Repository-Einstellungen > Secrets)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Ausrollen
        working-directory: website
        run: |
          npm ci
          npx wrangler deploy
