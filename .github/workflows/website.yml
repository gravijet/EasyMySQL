# Rollt die Website (Cloudflare Worker) automatisch aus: bei jeder Aenderung unter website/ auf main
# und nach jedem fertigen Release. Version und Downloads holt der Worker selbst live von GitHub
# (website/src/worker.js); das erneute Ausrollen haelt also auch Texte und Seiteninhalt aktuell.
# Einmalig noetig: die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID im Repository anlegen.
name: Website ausrollen

on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_run:
    workflows: ["EasyMySQL Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten pruefen
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN fehlt - die Website wird nicht ausgerollt (Repository-Einstellungen > Secrets)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Ausrollen
        if: steps.creds.outputs.ok == 'true'
        working-directory: website
        run: |
          npm ci
          npx wrangler deploy
