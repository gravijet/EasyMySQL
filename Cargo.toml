[package]
name = "easymysql"
version = "3.0.1"
edition = "2024"
description = "EasyMySQL - MariaDB fuer Windows, ganz einfach"
build = "build.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.35.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust", "buffer-pool"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3.4", features = ["json"] }
sha2 = "0.10"

[target."cfg(windows)".dependencies]
# Unter Windows DirectX 12 (mit Software-Fallback WARP) statt nur OpenGL
eframe = { version = "0.35.0", default-features = false, features = ["wgpu"] }
tray-icon = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Shutdown"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
