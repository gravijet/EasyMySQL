[package]
name = "easymysql"
version = "4.0.5"
edition = "2024"
description = "EasyMySQL - MariaDB server and graphical database manager for Windows"
build = "build.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.35.0"
hayro = "0.8"
portable-pty = "0.9"
vt100 = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust", "buffer-pool", "rustls-tls-ring"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3.4", features = ["json"] }
sha2 = "0.10"
postgres = "0.19"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target."cfg(windows)".dependencies]
# Use DirectX 12 with WARP software fallback on Windows.
eframe = { version = "0.35.0", default-features = false, features = ["wgpu"] }
tray-icon = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Shutdown", "Win32_System_DataExchange", "Win32_Graphics_Gdi"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
