[package]
name = "easymysql"
version = "1.1.0"
edition = "2024"
description = "EasyMySQL - MariaDB fuer Windows, ganz einfach"
build = "build.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.35.0"
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust", "buffer-pool"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
sqlformat = "0.5.0"

[target."cfg(windows)".dependencies]
# Unter Windows DirectX 12 (mit Software-Fallback WARP) statt nur OpenGL
eframe = { version = "0.35.0", default-features = false, features = ["wgpu"] }
tray-icon = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
